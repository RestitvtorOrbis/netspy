name: GitHub CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    defaults:
        run:
          shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        platform: [netframework, net, net-x86, net-x64]
        include:
          - platform: netframework
            package-name: netframework
            build-dir: net48
            target-framework: net48
            runtime-identifier: ''
            self-contained: 'false'
          - platform: net
            package-name: net
            build-dir: net10.0-windows
            target-framework: net10.0-windows
            runtime-identifier: ''
            self-contained: 'false'
          - platform: net-x86
            package-name: net-win32
            build-dir: net10.0-windows\win-x86\publish
            target-framework: net10.0-windows
            runtime-identifier: win-x86
            self-contained: 'true'
          - platform: net-x64
            package-name: net-win64
            build-dir: net10.0-windows\win-x64\publish
            target-framework: net10.0-windows
            runtime-identifier: win-x64
            self-contained: 'true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: microsoft/setup-msbuild@v3.0.0

      - name: Assert selected product build
        run: |
          $sdk = (& dotnet --version).Trim()
          $tfm = '${{ matrix.target-framework }}'
          $rid = '${{ matrix.runtime-identifier }}'
          $selfContained = '${{ matrix.self-contained }}'
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'The selected .NET SDK did not report a version.' }
          if ([string]::IsNullOrWhiteSpace($tfm)) { throw 'The product target framework is missing.' }
          if ([string]::IsNullOrWhiteSpace($selfContained)) { throw 'The product self-contained state is missing.' }
          Write-Host "Selected SDK: $sdk"
          Write-Host "Selected TFM: $tfm"
          Write-Host "Selected RID: $(if ($rid) { $rid } else { '(none)' })"
          Write-Host "Self-contained: $selfContained"

      - name: Build dnSpy (${{matrix.platform}})
        run: .\build.ps1 ${{matrix.platform}}

      - name: Create output directory
        run: New-Item -ItemType Directory -Path C:\builtfiles\dnSpy-${{matrix.platform}} -Force > $null

      - name:  Copy release files for upload
        run: Copy-Item -Path dnSpy\dnSpy\bin\Release\${{matrix.build-dir}}\* -Destination C:\builtfiles\dnSpy-${{matrix.platform}} -Recurse

      - uses: actions/upload-artifact@v7.0.1
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: dnSpy-${{matrix.package-name}}
          path: C:\builtfiles\dnSpy-${{matrix.platform}}
          if-no-files-found: error
          compression-level: 9

  historical-bundle-fixtures:
    name: Historical bundle fixtures (${{ matrix.generation }})
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: NetCoreApp31
            sdk: 3.1.426
            target-framework: netcoreapp3.1
            runtime-identifier: win-x64
            self-contained: 'false,true'
          - generation: Net5
            sdk: 5.0.408
            target-framework: net5.0
            runtime-identifier: win-x64
            self-contained: 'false,true'
          - generation: Net6
            sdk: 6.0.428
            target-framework: net6.0
            runtime-identifier: win-x64
            self-contained: 'false,true'
          - generation: Net8
            sdk: 8.0.419
            target-framework: net8.0
            runtime-identifier: win-x64
            self-contained: 'true'
          - generation: Net10
            sdk: 10.0.111
            target-framework: net10.0
            runtime-identifier: win-x64
            self-contained: 'false,true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Install pinned .NET SDK (${{ matrix.sdk }})
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Assert selected historical fixture build
        run: |
          $expectedSdk = '${{ matrix.sdk }}'
          $sdk = (& dotnet --version).Trim()
          $tfm = '${{ matrix.target-framework }}'
          $rid = '${{ matrix.runtime-identifier }}'
          $selfContained = '${{ matrix.self-contained }}'
          if ($sdk -ne $expectedSdk) { throw "Expected SDK $expectedSdk, but selected SDK is $sdk." }
          if ([string]::IsNullOrWhiteSpace($tfm)) { throw 'The historical fixture target framework is missing.' }
          if ([string]::IsNullOrWhiteSpace($rid)) { throw 'The historical fixture runtime identifier is missing.' }
          if ([string]::IsNullOrWhiteSpace($selfContained)) { throw 'The historical fixture self-contained state is missing.' }
          Write-Host "Selected SDK: $sdk"
          Write-Host "Selected TFM: $tfm"
          Write-Host "Selected RID: $rid"
          Write-Host "Self-contained variants: $selfContained"

      - name: Generate required artifacts with pinned SDK
        run: |
          # The generator enters the generation directory before checking dotnet --version,
          # so its adjacent global.json selects and verifies the exact installed SDK.
          & .\Tests\TestAssets\SingleFile\Generate-HistoricalFixtures.ps1 `
            -Generation '${{ matrix.generation }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Historical fixture generation failed for ${{ matrix.generation }}"
          }
          $root = Join-Path $PWD 'Tests/TestAssets/SingleFile/artifacts/historical/${{ matrix.generation }}'
          $sidecars = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter fixture.json)
          if ($sidecars.Count -eq 0) {
            throw "No fixture.json artifact was generated for ${{ matrix.generation }}"
          }
          foreach ($sidecar in $sidecars) {
            foreach ($name in @('inventory.json', 'hashes.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $sidecar.DirectoryName $name))) {
                throw "Required $name sidecar is missing beside $($sidecar.FullName)"
              }
            }
          }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dnSpy-single-file-historical-${{ matrix.generation }}
          # Upload from the common root so merge-multiple preserves the
          # generation directory when the five matrix artifacts are combined.
          path: Tests/TestAssets/SingleFile/artifacts/historical
          if-no-files-found: error
          compression-level: 9

  historical-bundle-tests:
    name: Historical bundle parser tests
    needs: historical-bundle-fixtures
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.111
          dotnet-quality: ga

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dnSpy-single-file-historical-*
          path: Tests/TestAssets/SingleFile/artifacts/historical
          merge-multiple: true

      - name: Require every downloaded historical fixture
        run: |
          $root = Join-Path $PWD 'Tests/TestAssets/SingleFile/artifacts/historical'
          $required = @('NetCoreApp31', 'Net5', 'Net6', 'Net8', 'Net10')
          foreach ($generation in $required) {
            $generationRoot = Join-Path $root $generation
            if (-not (Test-Path -LiteralPath $generationRoot -PathType Container)) {
              throw "Required historical generation artifact is missing: $generation"
            }
            if (@(Get-ChildItem -LiteralPath $generationRoot -Recurse -File -Filter fixture.json).Count -eq 0) {
              throw "Required historical fixture output is missing: $generation"
            }
          }

      - name: Assert selected modern fixture build
        run: |
          $sdk = (& dotnet --version).Trim()
          if ($sdk -ne '10.0.111') { throw "Expected SDK 10.0.111, but selected SDK is $sdk." }
          Write-Host "Selected SDK: $sdk"
          Write-Host 'Selected TFM: net10.0'
          Write-Host 'Selected RID: win-x64'
          Write-Host 'Self-contained variants: false,true'

      - name: Generate modern regression fixtures
        run: .\Tests\TestAssets\SingleFile\Generate-ModernFixtures.ps1

      - name: Run modern fixture regression
        run: dotnet test Tests/dnSpy.Bundles.Tests/dnSpy.Bundles.Tests.csproj -c Release -f net10.0 --filter FullyQualifiedName~ModernPublishedBundleTests

      - name: Run historical fixture matrix
        run: |
          $env:DNSPY_BUNDLE_FIXTURES = (Resolve-Path 'Tests/TestAssets/SingleFile/artifacts/historical').Path
          dotnet test Tests/dnSpy.Bundles.Tests/dnSpy.Bundles.Tests.csproj -c Release -f net10.0 --filter FullyQualifiedName~HistoricalPublishedBundleTests
