name: GitHub CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    defaults:
        run:
          shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        platform: [netframework, net, net-x86, net-x64]
        include:
          - platform: netframework
            package-name: netframework
            build-dir: net48
            target-framework: net48
            runtime-identifier: ''
            self-contained: 'false'
          - platform: net
            package-name: net
            build-dir: net10.0-windows
            target-framework: net10.0-windows
            runtime-identifier: ''
            self-contained: 'false'
          - platform: net-x86
            package-name: net-win32
            build-dir: net10.0-windows\win-x86\publish
            target-framework: net10.0-windows
            runtime-identifier: win-x86
            self-contained: 'true'
          - platform: net-x64
            package-name: net-win64
            build-dir: net10.0-windows\win-x64\publish
            target-framework: net10.0-windows
            runtime-identifier: win-x64
            self-contained: 'true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: microsoft/setup-msbuild@v3.0.0

      - name: Assert selected product build
        run: |
          $sdkOutput = & dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with exit code $LASTEXITCODE." }
          $sdk = ($sdkOutput | Out-String).Trim()
          $tfm = '${{ matrix.target-framework }}'
          $rid = '${{ matrix.runtime-identifier }}'
          $selfContained = '${{ matrix.self-contained }}'
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'The selected .NET SDK did not report a version.' }
          if ([string]::IsNullOrWhiteSpace($tfm)) { throw 'The product target framework is missing.' }
          if ([string]::IsNullOrWhiteSpace($selfContained)) { throw 'The product self-contained state is missing.' }
          Write-Host "Selected SDK: $sdk"
          Write-Host "Selected TFM: $tfm"
          Write-Host "Selected RID: $(if ($rid) { $rid } else { '(none)' })"
          Write-Host "Self-contained: $selfContained"

      - name: Build dnSpy (${{matrix.platform}})
        run: .\build.ps1 ${{matrix.platform}}

      - name: Create release archive
        env:
          BUILD_DIRECTORY: dnSpy\dnSpy\bin\Release\${{ matrix.build-dir }}
          OUTPUT_DIRECTORY: artifacts\packages\${{ matrix.package-name }}
          PACKAGE_NAME: ${{ matrix.package-name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          & .\Build\New-ReleaseArchive.ps1 `
            -BuildDirectory $env:BUILD_DIRECTORY `
            -OutputDirectory $env:OUTPUT_DIRECTORY `
            -PackageName $env:PACKAGE_NAME `
            -SourceCommit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Release archive creation failed with exit code $LASTEXITCODE."
          }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dnSpy-${{matrix.package-name}}
          path: |
            artifacts/packages/${{ matrix.package-name }}/netSpy-${{ matrix.package-name }}.zip
            artifacts/packages/${{ matrix.package-name }}/netSpy-${{ matrix.package-name }}.zip.sha256
            artifacts/packages/${{ matrix.package-name }}/netSpy-${{ matrix.package-name }}.zip.source.txt
          if-no-files-found: error
          compression-level: 9

  historical-bundle-fixtures:
    name: Historical bundle fixtures (${{ matrix.generation }})
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: NetCoreApp31
            sdk: 3.1.426
            target-framework: netcoreapp3.1
            runtime-identifier: win-x64
            self-contained: 'true'
          - generation: Net5
            sdk: 5.0.408
            target-framework: net5.0
            runtime-identifier: win-x64
            self-contained: 'false,true'
          - generation: Net6
            sdk: 6.0.428
            target-framework: net6.0
            runtime-identifier: win-x64
            self-contained: 'false,true'
          - generation: Net8
            sdk: 8.0.419
            target-framework: net8.0
            runtime-identifier: win-x64
            self-contained: 'true'
          - generation: Net10
            sdk: 10.0.111
            target-framework: net10.0
            runtime-identifier: win-x64
            self-contained: 'false,true'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Install pinned .NET SDK (${{ matrix.sdk }})
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Assert selected historical fixture build
        working-directory: Tests/TestAssets/SingleFile/${{ matrix.generation }}
        run: |
          $expectedSdk = '${{ matrix.sdk }}'
          $sdkOutput = & dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with exit code $LASTEXITCODE." }
          $sdk = ($sdkOutput | Out-String).Trim()
          $tfm = '${{ matrix.target-framework }}'
          $rid = '${{ matrix.runtime-identifier }}'
          $selfContained = '${{ matrix.self-contained }}'
          if ($sdk -ne $expectedSdk) { throw "Expected SDK $expectedSdk, but selected SDK is $sdk." }
          if ([string]::IsNullOrWhiteSpace($tfm)) { throw 'The historical fixture target framework is missing.' }
          if ([string]::IsNullOrWhiteSpace($rid)) { throw 'The historical fixture runtime identifier is missing.' }
          if ([string]::IsNullOrWhiteSpace($selfContained)) { throw 'The historical fixture self-contained state is missing.' }
          Write-Host "Selected SDK: $sdk"
          Write-Host "Selected TFM: $tfm"
          Write-Host "Selected RID: $rid"
          Write-Host "Self-contained variants: $selfContained"

      - name: Generate required artifacts with pinned SDK
        run: |
          # The generator enters the generation directory before checking dotnet --version,
          # so its adjacent global.json selects and verifies the exact installed SDK.
          & .\Tests\TestAssets\SingleFile\Generate-HistoricalFixtures.ps1 `
            -Generation '${{ matrix.generation }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Historical fixture generation failed for ${{ matrix.generation }}"
          }
          $root = Join-Path $PWD 'Tests/TestAssets/SingleFile/artifacts/historical/${{ matrix.generation }}'
          $sidecars = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter fixture.json)
          if ($sidecars.Count -eq 0) {
            throw "No fixture.json artifact was generated for ${{ matrix.generation }}"
          }
          foreach ($sidecar in $sidecars) {
            foreach ($name in @('inventory.json', 'hashes.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $sidecar.DirectoryName $name))) {
                throw "Required $name sidecar is missing beside $($sidecar.FullName)"
              }
            }
          }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dnSpy-single-file-historical-${{ matrix.generation }}
          # Upload from the common root so merge-multiple preserves the
          # generation directory when the five matrix artifacts are combined.
          path: Tests/TestAssets/SingleFile/artifacts/historical
          if-no-files-found: error
          compression-level: 9

  historical-bundle-tests:
    name: Historical bundle parser tests
    needs: historical-bundle-fixtures
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.111
          dotnet-quality: ga

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dnSpy-single-file-historical-*
          path: Tests/TestAssets/SingleFile/artifacts/historical
          merge-multiple: true

      - name: Require every downloaded historical fixture
        run: |
          $root = Join-Path $PWD 'Tests/TestAssets/SingleFile/artifacts/historical'
          $required = @('NetCoreApp31', 'Net5', 'Net6', 'Net8', 'Net10')
          foreach ($generation in $required) {
            $generationRoot = Join-Path $root $generation
            if (-not (Test-Path -LiteralPath $generationRoot -PathType Container)) {
              throw "Required historical generation artifact is missing: $generation"
            }
            if (@(Get-ChildItem -LiteralPath $generationRoot -Recurse -File -Filter fixture.json).Count -eq 0) {
              throw "Required historical fixture output is missing: $generation"
            }
          }

      - name: Assert selected modern fixture build
        working-directory: Tests/TestAssets/SingleFile/Net10
        run: |
          $sdkOutput = & dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with exit code $LASTEXITCODE." }
          $sdk = ($sdkOutput | Out-String).Trim()
          if ($sdk -ne '10.0.111') { throw "Expected SDK 10.0.111, but selected SDK is $sdk." }
          Write-Host "Selected SDK: $sdk"
          Write-Host 'Selected TFM: net10.0'
          Write-Host 'Selected RID: win-x64'
          Write-Host 'Self-contained variants: false,true'

      - name: Generate modern regression fixtures
        run: .\Tests\TestAssets\SingleFile\Generate-ModernFixtures.ps1

      - name: Run modern fixture regression
        run: dotnet test Tests/dnSpy.Bundles.Tests/dnSpy.Bundles.Tests.csproj -c Release -f net10.0 --filter FullyQualifiedName~ModernPublishedBundleTests

      - name: Run historical fixture matrix
        run: |
          $env:DNSPY_BUNDLE_FIXTURES = (Resolve-Path 'Tests/TestAssets/SingleFile/artifacts/historical').Path
          dotnet test Tests/dnSpy.Bundles.Tests/dnSpy.Bundles.Tests.csproj -c Release -f net10.0 --filter FullyQualifiedName~HistoricalPublishedBundleTests

  bundle-integration-tests:
    name: Bundle integration tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.111
          dotnet-quality: ga

      - uses: microsoft/setup-msbuild@v3.0.0

      - name: Generate modern regression fixtures
        run: |
          & .\Tests\TestAssets\SingleFile\Generate-ModernFixtures.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Modern fixture generation failed with exit code $LASTEXITCODE."
          }

      - name: Restore bundle integration tests
        run: |
          msbuild Tests/dnSpy.Bundles.IntegrationTests/dnSpy.Bundles.IntegrationTests.csproj -nologo -m -t:Restore -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) {
            throw "Bundle integration test restore failed with exit code $LASTEXITCODE."
          }

      - name: Build bundle integration tests
        run: |
          msbuild Tests/dnSpy.Bundles.IntegrationTests/dnSpy.Bundles.IntegrationTests.csproj -nologo -m -t:Build -p:Configuration=Release -p:TargetFramework=net10.0-windows
          if ($LASTEXITCODE -ne 0) {
            throw "Bundle integration test build failed with exit code $LASTEXITCODE."
          }

      - name: Run bundle integration tests
        run: |
          dotnet test Tests/dnSpy.Bundles.IntegrationTests/dnSpy.Bundles.IntegrationTests.csproj -c Release -f net10.0-windows --no-build --no-restore --filter 'FullyQualifiedName~BundleDocumentKeyTests|FullyQualifiedName~BundleDocumentProviderTests|FullyQualifiedName~BundleManagedDocumentTests|FullyQualifiedName~BundleDecompilerAnalyzerTests|FullyQualifiedName~OrdinaryLoadingDecompilerRegressionTests|FullyQualifiedName~BundleOpenPipelineTests'
          if ($LASTEXITCODE -ne 0) {
            throw "Bundle integration tests failed with exit code $LASTEXITCODE."
          }

      - name: Test release packaging
        run: |
          pwsh -NoProfile -File .\Build\Test-ReleasePackaging.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging test failed with exit code $LASTEXITCODE."
          }

      - name: Test release publication
        run: |
          pwsh -NoProfile -File .\Build\Test-ReleasePublication.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release publication test failed with exit code $LASTEXITCODE."
          }

  publish-release:
    name: Publish release
    needs: [build, historical-bundle-tests, bundle-integration-tests]
    if: ${{ success() && ((github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) }}
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.event_name == 'release' && github.event.release.tag_name || format('build-{0}', github.sha) }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dnSpy-netframework
          path: artifacts/packages/netframework

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dnSpy-net
          path: artifacts/packages/net

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dnSpy-net-win32
          path: artifacts/packages/net-win32

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dnSpy-net-win64
          path: artifacts/packages/net-win64

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || 'none' }}
          REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_DIRECTORY: artifacts/packages
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_ID: ${{ github.event.release.id || '' }}
        run: |
          & pwsh -NoProfile -File .\Build\Publish-Release.ps1 `
            -EventName $env:EVENT_NAME `
            -EventAction $env:EVENT_ACTION `
            -Ref $env:REF `
            -SourceCommit $env:SOURCE_COMMIT `
            -Repository $env:REPOSITORY `
            -RunUrl $env:RUN_URL `
            -ArtifactDirectory $env:ARTIFACT_DIRECTORY `
            -ReleaseTag $env:RELEASE_TAG `
            -ReleaseId $env:RELEASE_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Release publication failed with exit code $LASTEXITCODE."
          }
